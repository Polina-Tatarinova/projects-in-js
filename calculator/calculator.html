<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Стим-панк калькулятор</title>
    <link rel="stylesheet" href="./calculator.css" />
    <script src="./calculator.js" defer></script>
</head>
<body>
    <div class="steampunk-calculator">
        <!-- декоративные шестерёнки -->
        <div class="gear gear-1"></div>
        <div class="gear gear-2"></div>
        <div class="gear gear-3"></div>

        <div class="calculator-frame">
            <!-- верхние заклёпки -->
            <div class="rivet-row">
                <span class="rivet"></span>
                <span class="rivet"></span>
                <span class="rivet"></span>
                <span class="rivet"></span>
                <span class="rivet"></span>
            </div>

            <!-- шильдик -->
            <div class="brand-plate">
                <span class="brand-text">⚙ ХРОНО-МАТ ⚙</span>
            </div>

            <!-- дисплей -->
            <div class="display-container">
                <div class="display-bezel">
                    <div class="display-glass">
                        <div class="display" id="display">0</div>
                    </div>
                </div>
                <div class="display-rivets">
                    <span class="rivet-small"></span>
                    <span class="rivet-small"></span>
                </div>
            </div>

            <!-- сетка кнопок -->
            <div class="button-grid">
                <!-- ряд 1: C, +/-, %, ÷ -->
                <button class="btn function">C</button>
                <button class="btn function">±</button>
                <button class="btn function">%</button>
                <button class="btn operator" >/</button>

                <!-- ряд 2: 7 8 9 × -->
                <button class="btn digit">7</button>
                <button class="btn digit">8</button>
                <button class="btn digit">9</button>
                <button class="btn operator">*</button>

                <!-- ряд 3: 4 5 6 - -->
                <button class="btn digit">4</button>
                <button class="btn digit">5</button>
                <button class="btn digit">6</button>
                <button class="btn operator">-</button>

                <!-- ряд 4: 1 2 3 + -->
                <button class="btn digit">1</button>
                <button class="btn digit">2</button>
                <button class="btn digit" >3</button>
                <button class="btn operator" >+</button>

                <!-- ряд 5: 0 (широкая), ., = -->
                <button class="btn digit wide">0</button>
                <button class="btn digit" >.</button>
                <button class="btn equals" >=</button>
            </div>

            <!-- нижние заклёпки -->
            <div class="rivet-row bottom">
                <span class="rivet"></span>
                <span class="rivet"></span>
                <span class="rivet"></span>
                <span class="rivet"></span>
                <span class="rivet"></span>
            </div>
        </div>
    </div>

</body>
</html>
