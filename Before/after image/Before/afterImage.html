<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slider Before After</title>
    <link rel="stylesheet" href="./afterImage.css" />
  </head>
  <body>
    <div class="image-block">
      <img src="./img/fon1.jpg" alt="Before" />
      <div class="image-after">
        <img src="./img/fon2.jpg" alt="After" />
      </div>
      <input type="range" id="rangeBtn" min="0" max="100" value="50" />
    </div>

    <div class="image-block">
      <img src="./img/fon3.jpg" alt="Before" />
      <div class="image-after">
        <img src="./img/fon4.jpg" alt="After" />
      </div>
      <input type="range" id="rangeBtn" min="0" max="100" value="50" />
    </div>

    <div class="image-block">
      <img src="./img/fon5.jpg" alt="Before" />
      <div class="image-after">
        <img src="./img/fon6.jpg" alt="After" />
      </div>
      <input type="range" id="rangeBtn" min="0" max="100" value="50" />
    </div>

    <div class="image-block">
      <img src="./img/fon7.jpg" alt="Before" />
      <div class="image-after">
        <img src="./img/fon8.jpg" alt="After" />
      </div>
      <input type="range" id="rangeBtn" min="0" max="100" value="50" />
    </div>
    <script src="./afterImage.js"></script>
  </body>
</html>
